server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/userdb
    username: spendwise
    password: spendwise
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
      
app:
  jwt:
    secret: "ReplaceThisWithALongRandomSecretKeyAtLeast256BitsForHS256Algorithm"
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    
    
    
    