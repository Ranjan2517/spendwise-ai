version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: spendwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: spendwise
    ports:
      - "5433:5432"
    volumes:
      - spendwise-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendwise"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - spendwise-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: spendwise-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@spendwise.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - spendwise-net

networks:
  spendwise-net:
    driver: bridge

volumes:
  spendwise-postgres-data: