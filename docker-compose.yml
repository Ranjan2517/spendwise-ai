services:

  # =========================================================
  # PostgreSQL
  # =========================================================
  postgres:
    image: postgres:16
    container_name: spendwise-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: spendwise

    ports:
      - "5433:5432"

    volumes:
      - spendwise-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendwise"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - spendwise-net


  # =========================================================
  # pgAdmin
  # =========================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: spendwise-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@spendwise.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - spendwise-net


  # =========================================================
  # Eureka Discovery Server
  # =========================================================
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile

    container_name: spendwise-discovery-server
    restart: unless-stopped

    ports:
      - "8761:8761"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8761/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - spendwise-net


  # =========================================================
  # Spring Cloud Config Server
  # =========================================================
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile

    container_name: spendwise-config-server
    restart: unless-stopped

    ports:
      - "8888:8888"

    environment:

      # Location of local Config Repository inside container
      CONFIG_REPO_LOCATION: file:/config-repo

      # Enable Eureka registration
      EUREKA_CLIENT_ENABLED: "true"

      # Eureka address inside Docker network
      EUREKA_URL: http://discovery-server:8761/eureka/

    volumes:
      - ./config-repo:/config-repo

    depends_on:
      discovery-server:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8888/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - spendwise-net


  # =========================================================
  # User Service
  # =========================================================
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile

    container_name: spendwise-user-service
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:

      SPRING_PROFILES_ACTIVE: docker

      # Config Server inside Docker network
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888

      # PostgreSQL inside Docker network
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb
      SPRING_DATASOURCE_USERNAME: spendwise
      SPRING_DATASOURCE_PASSWORD: spendwise

      # JWT
      JWT_SECRET: ReplaceThisWithARealLongRandomSecretKeyAtLeast256BitsForHS256

      # Eureka
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_URL: http://discovery-server:8761/eureka/

    depends_on:

      postgres:
        condition: service_healthy

      discovery-server:
        condition: service_healthy

      config-server:
        condition: service_healthy

    networks:
      - spendwise-net


  # =========================================================
  # API Gateway
  # =========================================================
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile

    container_name: spendwise-api-gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:

      SPRING_PROFILES_ACTIVE: docker

      # Config Server inside Docker network
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888

      # Eureka
      EUREKA_CLIENT_ENABLED: "true"

      # This variable is useful if your config uses ${EUREKA_URL}
      EUREKA_URL: http://discovery-server:8761/eureka/

      # Direct Spring Boot override for Eureka defaultZone
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

      # Same JWT secret as User Service.
      # We will use this for Gateway JWT validation next.
      JWT_SECRET: ReplaceThisWithARealLongRandomSecretKeyAtLeast256BitsForHS256

    depends_on:

      discovery-server:
        condition: service_healthy

      config-server:
        condition: service_healthy

      user-service:
        condition: service_started

    networks:
      - spendwise-net


# =========================================================
# Docker Network
# =========================================================
networks:

  spendwise-net:
    driver: bridge


# =========================================================
# Volumes
# =========================================================
volumes:

  spendwise-postgres-data: